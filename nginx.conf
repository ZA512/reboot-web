server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $oauth_broker http://oauth-broker:3000;

    location /api/ {
        proxy_pass $oauth_broker$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /app.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # The app shell loads JavaScript and CSS by stable URLs. They must be
    # revalidated on every visit, otherwise an upstream proxy can serve an
    # older client next to a newer broker API after a deployment.
    location ~* \.(?:js|css|svg|json|webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    }

    location = /version.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    }

    location ~ ^/(index\.html|calculateur\.html|verifier\.html|historique\.html|sauvegarde\.html|drive\.html|entry\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
