<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e6f67">
  <title>REBOOT — Journal des modifications</title>
  <link rel="stylesheet" href="app-shell.css">
  <style>
    :root{--bg:#f5f6f1;--card:#fff;--ink:#18312f;--muted:#6b7d79;--line:#dce5df;--brand:#0e6f67;--soft:#dff1e9;--warn:#bc7a20}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}.top{min-height:70px;padding:14px max(20px,calc((100% - 1000px)/2));display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);background:rgba(245,246,241,.94)}.brand{font:800 15px Arial,sans-serif;letter-spacing:.08em;text-decoration:none}.brand span{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;border-radius:10px;background:var(--brand);color:#fff}.nav{margin-left:auto;display:flex;gap:15px;flex-wrap:wrap}.nav a{font:700 13px Arial,sans-serif;color:var(--brand);text-decoration:none}.shell{max-width:1000px;margin:auto;padding:50px 20px 72px}.kicker{margin:0;color:var(--brand);font:800 11px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase}h1{margin:7px 0 10px;font-size:clamp(2.2rem,6vw,4.3rem);line-height:1;letter-spacing:-.05em}.lead{max-width:670px;margin:0;color:var(--muted);font-size:1.06rem}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:30px 0 14px}.count{color:var(--muted);font:700 13px Arial,sans-serif}.button{border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:#fff;color:var(--ink);font:700 13px Arial,sans-serif;cursor:pointer}.button:hover{border-color:var(--brand);color:var(--brand)}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 7px 18px rgba(28,58,51,.04)}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--soft);color:var(--brand);font:800 18px Arial,sans-serif}.item.deleted .mark{background:#fff0eb;color:#b34f3a}.item.closed .mark{background:#fff5df;color:#8d5a12}.title{font:800 16px Arial,sans-serif}.meta{margin-top:3px;color:var(--muted);font:12px Arial,sans-serif}.details{color:var(--muted);font:12px Arial,sans-serif;text-align:right;max-width:210px}.empty{padding:42px 22px;border:1px dashed #bfcec7;border-radius:14px;background:#fff;text-align:center;color:var(--muted)}.empty strong{display:block;margin-bottom:5px;color:var(--ink);font:800 18px Arial,sans-serif}@media(max-width:620px){.nav{gap:10px}.nav a:not(:first-child){display:none}.shell{padding:38px 17px 55px}.item{grid-template-columns:42px 1fr}.details{grid-column:2;text-align:left}.toolbar{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
  <header class="reboot-nav"><a class="reboot-nav-brand" href="app.html"><span class="reboot-nav-mark">R</span><span><strong>REBOOT</strong><small>Le budget du foyer, sans détour</small></span></a><nav class="reboot-nav-links" aria-label="Navigation principale"><a class="reboot-nav-link" href="app.html">Suivi</a><a class="reboot-nav-link" href="calculateur.html">Préparer le budget</a><a class="reboot-nav-link reboot-nav-link--verify" href="verifier.html">Vérifier</a><details class="reboot-nav-more"><summary>Plus</summary><div class="reboot-nav-menu"><a href="sauvegarde.html">Sauvegardes</a><a href="drive.html">Google Drive</a><a href="historique.html" aria-current="page">Historique</a><a href="index.html">La méthode</a></div></details></nav></header>
  <main class="shell"><p class="kicker">Traçabilité locale</p><h1>Journal des modifications</h1><p class="lead">Les créations, corrections, suppressions et clôtures sont conservées ici. Vos mouvements restent disponibles dans l’APP.</p><div class="toolbar"><span class="count" id="count"></span><button class="button" id="clear" type="button">Effacer le journal affiché</button></div><section class="list" id="list" aria-live="polite"></section></main>
  <script src="secure-storage.js"></script>
  <script>
    const DB='reboot-local-v1',STORE='reboot-local-v1',list=document.querySelector('#list'),count=document.querySelector('#count');let state={};
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const label={expense:'Dépense',reserve:'Réserve',refund:'Remboursement',transfer:'Transfert'};
    const verb={created:'Ajouté',updated:'Modifié',deleted:'Supprimé',closed:'Terminé'};
    const icon={created:'+',updated:'↺',deleted:'−',closed:'✓'};
    function description(event){const data=event.after||event.before||{};const name=data.label||data.name||'Sans libellé';const amount=Number(data.amountMinor||data.monthlyContributionMinor||0);const suffix=amount?` · ${(amount/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}`:'';return esc(name)+suffix}
    function render(){const events=[...(state.auditEvents||[])].sort((a,b)=>String(b.at).localeCompare(String(a.at)));count.textContent=events.length?`${events.length} modification${events.length>1?'s':''} conservée${events.length>1?'s':''}`:'Aucune modification enregistrée';list.innerHTML=events.length?events.map(event=>`<article class="item ${esc(event.type)}"><div class="mark">${icon[event.type]||'•'}</div><div><div class="title">${verb[event.type]||'Mis à jour'} · ${label[event.entity]||'Élément'}</div><div class="meta">${description(event)}</div></div><div class="details">${new Intl.DateTimeFormat('fr-FR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(event.at))}</div></article>`).join(''):'<div class="empty"><strong>Pas encore de correction.</strong>Les modifications à venir apparaîtront ici.</div>'}
    document.querySelector('#clear').addEventListener('click',async()=>{if(!(state.auditEvents||[]).length||!confirm('Effacer uniquement cet historique de modifications ? Les dépenses et réserves restent inchangées.'))return;state.auditEvents=[];await RebootSecureStorage.save(DB,state);render()});
    (async()=>{state=await RebootSecureStorage.read(DB,STORE)||{};render()})().catch(()=>{list.innerHTML='<div class="empty"><strong>Historique indisponible.</strong>Le coffre local ne peut pas être lu dans ce navigateur.</div>'});
  </script>
</body>
</html>
