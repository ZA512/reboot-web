le th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#f8fafc}.table tr:last-child td{border-bottom:0}.group-card{border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;background:#fff}.group-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.occurrences{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.occ{background:#f3f6fb;border-radius:999px;padding:6px 9px;font-size:.78rem}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:.76rem;font-weight:850}.badge.good{background:var(--good-soft);color:var(--good)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.info{background:var(--info-soft);color:var(--info)}.badge.in{background:var(--good-soft);color:var(--good)}.badge.out{background:var(--danger-soft);color:var(--danger)}
.group-card.in{border-left:5px solid #36a376}.group-card.out{border-left:5px solid #df6b61}.group-title{font-weight:900;word-break:break-word}.group-match{font-size:.78rem;color:var(--muted);margin-top:4px}.occ.in{background:var(--good-soft);color:#205f45}.occ.out{background:var(--danger-soft);color:#8e2a21}.amount-in{color:var(--good);font-weight:900}.amount-out{color:var(--danger);font-weight:900}.col-in{background:#f0fbf5!important}.col-out{background:#fff4f2!important}.group-tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.group-tools .input{max-width:330px}.direction-note{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0;color:var(--muted);font-size:.84rem}.calendar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end}.month{border:1px solid var(--line);border-radius:11px;padding:8px 5px;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}.month .bar{margin:0 auto 6px;width:60%;border-radius:7px 7px 3px 3px;background:#cfd7e8;min-height:3px}.month.hot{background:#fff8e8;border-color:#e4b45d}.month.hot .bar{background:#efaa3b}.month .m{font-weight:900;font-size:.72rem}.month .amt{font-size:.76rem;font-weight:950}.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.result-card{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff}.result-card .k{font-size:.78rem;color:var(--muted)}.result-card .v{font-size:1.45rem;font-weight:950;letter-spacing:-.03em}.result-hero{border-radius:18px;padding:22px;background:linear-gradient(135deg,#263fba,#5f78e7);color:#fff;margin-bottom:16px}.result-hero .big{font-size:clamp(2.2rem,5vw,3.5rem);font-weight:950}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.error-list{display:none}.error-list.show{display:block}

<script>
const $=(s,root=document)=>root.querySelector(s), $$=(s,root=document)=>[...root.querySelectorAll(s)];
const DATABASE='reboot-calculator-v1', STORE='reboot-site-v02';
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const state={
 step:0, mode:'csv', rawRows:[], headers:[], mapping:{headerRow:0,delimiter:'auto',date:'',label:'',amountMode:'signed',amount:'',debit:'',credit:'',dateFormat:'auto'},
 tx:[], groups:[], manualMonthly:[], annual:[], startDate:new Date().toISOString().slice(0,10),
 minWeekly:{food:0,fuel:0,health:0,children:0,other:0}, balance:{enabled:false,low:0,target:0,effort:0}, groupFilter:'all', groupSearch:''
};
function save(){RebootSecureStorage.save(DATABASE,state).catch(()=>{})}
async function load(){try{const saved=await RebootSecureStorage.read(DATABASE,STORE);if(saved)Object.assign(state,saved)}catch{}}
function money(v){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(v)||0)}
function num(v){if(typeof v==='number')return v;return Number(String(v??'').replace(/\s/g,'').replace(',','.'))||0}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addMonths(d,n){const x=new Date(d+'T12:00:00');x.setMonth(x.getMonth()+n);return x}
function parseDate(v,fmt='auto'){const s=String(v||'').trim();if(!s)return null;let d=null;
 if(fmt==='dmy'||(fmt==='auto'&&/^\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}$/.test(s))){const [a,b,c]=s.split(/[\/.-]/).map(Number);d=new Date(c<100?2000+c:c,b-1,a)}
 else if(fmt==='ymd'||/^\d{4}[\/.-]\d{1,2}[\/.-]\d{1,2}$/.test(s)){const [a,b,c]=s.split(/[\/.-]/).map(Number);d=new Date(a,b-1,c)}
 else {const t=Date.parse(s);if(!Number.isNaN(t))d=new Date(t)}
 return d&&Number.isFinite(d.getTime())?d:null}
function dateFr(d){return d?new Intl.DateTimeFormat('fr-FR').format(d):'—'}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function normalizeLabel(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()
 .replace(/\b(CB|CARTE|PAIEMENT|PRLV|PRELEVEMENT|VIR|VIREMENT|SEPA|FACTURE|ACHAT|RETRAIT|EUROS?|EUR)\b/g,' ')
 .replace(/\d+/g,' ').replace(/[^A-Z\s]/g,' ').replace(/\s+/g,' ').trim()}
async function readBankFile(file){const buffer=await file.arrayBuffer();let text='';let encoding='UTF-8';try{text=new TextDecoder('utf-8',{fatal:true}).decode(buffer)}catch{text=new TextDecoder('windows-1252').decode(buffer);encoding='Windows-1252'}if(text.includes('�')){const cp=new TextDecoder('windows-1252').decode(buffer);if((cp.match(/�/g)||[]).length<(text.match(/�/g)||[]).length){text=cp;encoding='Windows-1252'}}return {text,encoding}}
function detectDelimiter(text){const lines=text.split(/\r?\n/).filter(x=>x.trim()).slice(0,8);const opts=[';',',','\t','|'];let best=';',score=-1;for(const d of opts){const c=lines.map(l=>(l.match(new RegExp('\\'+d,'g'))||[]).length);const s=c.reduce((a,b)=>a+b,0)-Math.max(...c)+Math.min(...c);if(s>score){score=s;best=d}}return best}
function parseCSV(text,delimiter){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===delimiter&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[]}else cell+=c}row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);return rows}
function autoHeader(rows){let best=0,score=-1;for(let i=0;i<Math.min(rows.length,30);i++){const s=rows[i].filter(x=>String(x).trim()).length+(rows[i].join(' ').match(/date|libell|débit|debit|crédit|credit|montant/gi)||[]).length*3;if(s>score){score=s;best=i}}return best}
function monthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthDistance(a,b){return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())}
function analyzeIntervals(ds){if(ds.length<2)return {kind:'inconnu',avg:0};const clean=[...new Map(ds.map(d=>[d.toISOString().slice(0,10),d])).values()].sort((a,b)=>a-b);const dif=[];for(let i=1;i<clean.length;i++){const diff=daysBetween(clean[i-1],clean[i]);if(diff>=3)dif.push(diff)}if(!dif.length)return {kind:'inconnu',avg:0};const avg=dif.reduce((a,b)=>a+b,0)/dif.length;if(avg>=25&&avg<=38)return {kind:'mensuel',avg};if(avg>=330&&avg<=400)return {kind:'annuel',avg};if(avg>=5&&avg<=10)return {kind:'hebdomadaire',avg};if(avg>=12&&avg<=18)return {kind:'bimensuel',avg};return {kind:'irrégulier',avg}}
function monthlyStats(items){const buckets=new Map();for(const t of items){const k=monthKey(t.date);buckets.set(k,(buckets.get(k)||0)+Math.abs(t.amount))}const values=[...buckets.values()];const dates=items.map(x=>x.date).sort((a,b)=>a-b);const span=dates.length?monthDistance(dates[0],dates.at(-1))+1:0;const active=buckets.size;const average=values.length?values.reduce((a,b)=>a+b,0)/values.length:0;return {buckets,values,span,active,average,coverage:span?active/span:0}}
function clusterTransactions(){
 const previous=new Map((state.groups||[]).map(g=>[g.key,g]));const map=new Map();
 for(const t of state.tx){const normalized=normalizeLabel(t.label)||String(t.label||'').trim().toUpperCase();const key=(t.amount>=0?'IN|':'OUT|')+normalized;if(!map.has(key))map.set(key,[]);map.get(key).push(t)}
 state.groups=[...map.entries()].map(([key,items],idx)=>{items.sort((a,b)=>a.date-b.date);const dates=items.map(x=>x.date),inter=analyzeIntervals(dates),ms=monthlyStats(items);let detected=inter.kind;if(ms.active>=2&&ms.coverage>=.6)detected='mensuel';const rawAverage=items.reduce((a,b)=>a+Math.abs(b.amount),0)/items.length;const proposed=detected==='mensuel'?ms.average:rawAverage;const existing=previous.get(key)||{};return {id:existing.id||'g'+idx,key,label:items.at(-1).label,latestLabel:items.at(-1).label,norm:key.split('|')[1],direction:items[0].amount>=0?'in':'out',items,avg:rawAverage,monthlyAverage:ms.average,activeMonths:ms.active,monthSpan:ms.span,kind:existing.kind||detected,category:existing.category||'',acceptedAmount:existing.acceptedAmount??Math.round(proposed*100)/100,confirmed:existing.confirmed||false}})
 .filter(g=>g.items.length>=2).sort((a,b)=>b.items.length-a.items.length)
}
function annualizeGroup(g){const amt=num(g.acceptedAmount);if(g.category==='salary'||g.category==='income_monthly'||g.category==='charge_monthly'||g.category==='reserve_monthly')return amt*12;
 if(g.category==='income_annual'||g.category==='charge_annual')return amt;
 return 0}
function resultData(){
 let income=0,monthlyCharges=0,annualCharges=0;
 for(const g of state.groups){if(!g.confirmed)continue;const a=annualizeGroup(g);if(['salary','income_monthly','income_annual'].includes(g.category))income+=a;if(['charge_monthly','reserve_monthly'].includes(g.category))monthlyCharges+=a;if(g.category==='charge_annual')annualCharges+=a}
 for(const m of state.manualMonthly){const a=num(m.amount)*12;if(m.type==='income')income+=a;else monthlyCharges+=a}
 const annualNet=state.annual.reduce((s,e)=>s+Math.max(0,num(e.amount)-num(e.aid)-num(e.covered)),0);
 const weekly=(income-monthlyCharges-annualCharges-annualNet)/52;
 const histVariable=state.tx.filter(t=>t.amount<0&&!isMatchedTx(t)).reduce((s,t)=>s+Math.abs(t.amount),0);
 const spanMonths=state.tx.length?Math.max(1,(Math.max(...state.tx.map(t=>t.date))-Math.min(...state.tx.map(t=>t.date)))/2629800000):12;
 return {income,monthlyCharges,annualCharges,annualNet,weekly,histVariableMonthly:histVariable/spanMonths}
}
function isMatchedTx(t){return state.groups.some(g=>g.confirmed&&g.items.some(x=>x===t)&&!['weekly_spend','ignore'].includes(g.category))}
function eventDateThisCycle(month,day=15){const start=new Date(state.startDate+'T12:00:00');let d=new Date(start.getFullYear(),month,day);if(d<start)d=new Date(start.getFullYear()+1,month,day);return d}
function tamponData(){
 const start=new Date(state.startDate+'T12:00:00');const rows=[];
 for(const e of state.annual){const net=Math.max(0,num(e.amount)-num(e.aid)-num(e.covered));const due=eventDateThisCycle(num(e.month),num(e.day)||15);const weeks=Math.max(0,(due-start)/604800000);const natural=Math.min(net,net*weeks/52);const gap=Math.max(0,net-natural);rows.push({...e,net,due,weeks,natural,gap,weeklyJit:weeks>0?gap/weeks:gap})}
 return {rows,total:rows.reduce((s,r)=>s+r.gap,0),max:Math.max(0,...rows.map(r=>r.gap)),peakWeekly:rows.reduce((s,r)=>s+r.weeklyJit,0)}
}
function render(){
 const steps=['Accueil','Source des données','Colonnes du CSV','Opérations détectées','Montants manuels','Dépenses annuelles','Besoins hebdomadaires','Résultat'];
 $('#stepMeta').textContent=`Étape ${state.step+1} sur ${steps.length} — ${steps[state.step]}`;$('#bar').style.width=((state.step+1)/steps.length*100)+'%';
 const main=$('#main'),side=$('#side');main.innerHTML=renderStep(state.step);side.innerHTML=renderSide(state.step);bind();
 $('#back').disabled=state.step===0;$('#next').textContent=state.step===steps.length-1?'Imprimer':'Continuer'
}
function renderStep(s){
 if(s===0)return `<div class="eyebrow">Calculateur local</div><h2>Calculer votre budget semaine</h2><p class="lead">Vous pouvez importer un CSV bancaire pour contrôler vos chiffres ou tout saisir à la main.</p><div class="choice-grid">
 ${choice('mode','csv','Importer un export CSV','Le fichier reste dans votre navigateur. Vous validerez les colonnes et les opérations détectées.')}
 ${choice('mode','manual','Tout saisir à la main','Vous renseignez vous-même vos revenus, charges mensuelles et dépenses annuelles.')}
 </div><div class="callout good"><strong>Aucune donnée n’est envoyée.</strong><br>Vous pourrez sauvegarder le dossier REBOOT dans un fichier JSON local.</div>`;
 if(s===1)return state.mode==='csv'?`<div class="eyebrow">Import bancaire</div><h2>Choisissez votre export CSV</h2><p class="lead">Le calculateur accepte les fichiers avec une colonne de montant signé ou deux colonnes débit/crédit.</p><div class="field"><label class="label">Fichier CSV</label><input id="csvFile" class="input" type="file" accept=".csv,text/csv"></div>${state.rawRows.length?`<div class="callout good"><strong>${state.rawRows.length} lignes lues.</strong><br>Encodage détecté : ${state.fileEncoding||'automatique'} · ligne d’en-tête proposée : ${state.mapping.headerRow+1}.</div>`:''}`:
 `<div class="eyebrow">Saisie manuelle</div><h2>Ajoutez vos montants mensuels</h2><p class="lead">Commencez par les revenus et charges qui reviennent tous les mois.</p>${manualRowsHtml()}`;
 if(s===2){if(state.mode==='manual')return `<div class="eyebrow">Saisie manuelle</div><h2>Vérifiez vos montants</h2>${manualRowsHtml()}`;return mappingHtml()}
 if(s===3){if(state.mode==='manual')return `<div class="eyebrow">Montants mensuels</div><h2>Ajoutez ce qui manque</h2>${manualRowsHtml()}`;return groupsHtml()}
 if(s===4)return `<div class="eyebrow">Compléments</div><h2>Ajoutez les revenus ou charges absents</h2><p class="lead">Utilisez cette page pour ce qui n’était pas détecté ou n’existait pas dans la période importée.</p>${manualRowsHtml()}`;
 if(s===5)return annualHtml();
 if(s===6)return needsHtml();
 return resultsHtml()
}
function choice(key,val,title,desc){return `<label class="choice"><input type="radio" name="${key}" data-key="${key}" value="${val}" ${state[key]===val?'checked':''}><div><strong>${title}</strong><span>${desc}</span></div></label>`}
function manualRowsHtml(){return `<div id="manualList">${state.manualMonthly.map((m,i)=>`<div class="group-card"><div class="field-row three"><div class="field"><label class="label">Nom</label><input class="input" data-manual="${i}|name" value="${esc(m.name)}"></div><div class="field"><label class="label">Type</label><select class="select" data-manual="${i}|type"><option value="income" ${m.type==='income'?'selected':''}>Revenu mensuel</option><option value="charge" ${m.type==='charge'?'selected':''}>Charge mensuelle</option></select></div><div class="field"><label class="label">Montant moyen</label><div class="money"><input class="input" type="number" data-manual="${i}|amount" value="${num(m.amount)}"></div></div></div><button class="btn ghost small" data-remove-manual="${i}">Supprimer</button></div>`).join('')}</div><button class="btn secondary" id="addManual">+ Ajouter un montant mensuel</button>`
}
function mappingHtml(){const headers=state.headers;const opts=(sel)=>`<option value="">— choisir —</option>`+headers.map((h,i)=>`<option value="${i}" ${String(sel)===String(i)?'selected':''}>${esc(h||'Colonne '+(i+1))}</option>`).join('');
 return `<div class="eyebrow">Colonnes du fichier</div><h2>Indiquez ce que contient chaque colonne</h2><div class="field-row"><div class="field"><label class="label">Ligne d’en-tête</label><input class="input" type="number" min="1" data-map="headerRow" value="${num(state.mapping.headerRow)+1}"></div><div class="field"><label class="label">Format de date</label><select class="select" data-map="dateFormat"><option value="auto">Détection automatique</option><option value="dmy" ${state.mapping.dateFormat==='dmy'?'selected':''}>JJ/MM/AAAA</option><option value="ymd" ${state.mapping.dateFormat==='ymd'?'selected':''}>AAAA-MM-JJ</option></select></div></div>
 <div class="field-row"><div class="field"><label class="label">Date</label><select class="select" data-map="date">${opts(state.mapping.date)}</select></div><div class="field"><label class="label">Libellé</label><select class="select" data-map="label">${opts(state.mapping.label)}</select></div></div>
 <div class="choice-grid">${mapChoice('signed','Une seule colonne de montant','Les crédits sont positifs et les débits négatifs.')}${mapChoice('split','Deux colonnes débit et crédit','Une colonne pour les sorties et une pour les entrées.')}</div>
 ${state.mapping.amountMode==='signed'?`<div class="field"><label class="label">Montant signé</label><select class="select" data-map="amount">${opts(state.mapping.amount)}</select></div>`:`<div class="field-row"><div class="field"><label class="label">Débit</label><select class="select" data-map="debit">${opts(state.mapping.debit)}</select></div><div class="field"><label class="label">Crédit</label><select class="select" data-map="credit">${opts(state.mapping.credit)}</select></div></div>`}
 ${previewHtml()}`}
function mapChoice(v,t,d){return `<label class="choice"><input type="radio" name="amountMode" data-map="amountMode" value="${v}" ${state.mapping.amountMode===v?'checked':''}><div><strong>${t}</strong><span>${d}</span></div></label>`}
function previewHtml(){if(!state.rawRows.length)return'';const h=state.rawRows[state.mapping.headerRow]||[],debit=String(state.mapping.debit),credit=String(state.mapping.credit);return `<div class="direction-note"><span class="amount-in">● Entrée d'argent</span><span class="amount-out">● Sortie d'argent</span></div><div class="table-wrap"><table class="table"><thead><tr>${h.map((x,i)=>`<th class="${String(i)===debit?'col-out':String(i)===credit?'col-in':''}">${esc(x)}${String(i)===debit?'<br><span class="amount-out">SORTIE</span>':String(i)===credit?'<br><span class="amount-in">ENTRÉE</span>':''}</th>`).join('')}</tr></thead><tbody>${state.rawRows.slice(state.mapping.headerRow+1,state.mapping.headerRow+5).map(r=>`<tr>${h.map((_,i)=>`<td class="${String(i)===debit?'col-out':String(i)===credit?'col-in':''}">${esc(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function groupsHtml(){const query=String(state.groupSearch||'').toUpperCase(),filter=state.groupFilter||'all';const groups=state.groups.filter(g=>(filter==='all'||g.direction===filter)&&(!query||String(g.latestLabel||g.label).toUpperCase().includes(query)||g.norm.includes(query)));return `<div class="eyebrow">Détection</div><h2>Validez les entrées et sorties récurrentes</h2><p class="lead">Les chiffres et dates servent uniquement à rapprocher les opérations. Le titre affiche toujours le dernier libellé bancaire original.</p><div class="direction-note"><span class="badge in">Entrée d'argent</span><span class="badge out">Sortie d'argent</span></div><div class="group-tools"><input class="input" id="groupSearch" placeholder="Rechercher un libellé…" value="${esc(state.groupSearch||'')}"><select class="select" id="groupFilter" style="max-width:220px"><option value="all">Toutes les opérations</option><option value="in" ${filter==='in'?'selected':''}>Entrées uniquement</option><option value="out" ${filter==='out'?'selected':''}>Sorties uniquement</option></select></div>${groups.length?groups.map(groupHtml).join(''):`<div class="callout warn"><strong>Aucun groupe dans ce filtre.</strong><br>Modifiez la recherche ou ajoutez les montants manuellement.</div>`}<details><summary>Voir les opérations non classées</summary><div class="details-body">${unmatchedHtml()}</div></details>`}
function groupHtml(g){const cats=g.direction==='in'?[['salary','Salaire'],['income_monthly','Autre revenu mensuel'],['income_annual','Revenu annuel'],['ignore','Ignorer']]:[['charge_monthly','Charge mensuelle'],['reserve_monthly','Versement mensuel vers une réserve'],['charge_annual','Charge annuelle'],['weekly_spend','Dépense du restant à vivre'],['ignore','Transfert ou opération à ignorer']];const monthly=g.kind==='mensuel';const proposed=monthly?g.monthlyAverage:g.avg;return `<div class="group-card ${g.direction}"><div class="group-head"><div><div class="group-title">${esc(g.latestLabel||g.label)}</div><div class="group-match">Regroupé avec : « ${esc(g.norm)} »</div><div class="muted">${g.items.length} opérations · ${g.activeMonths||0} mois concernés · rythme détecté : ${g.kind}</div></div><div><span class="badge ${g.direction}">${g.direction==='in'?'Entrée':'Sortie'}</span><br><span class="badge info" style="margin-top:6px">${money(proposed)} ${monthly?'par mois':'en moyenne'}</span></div></div><div class="occurrences">${g.items.slice(0,12).map(x=>`<span class="occ ${g.direction}">${dateFr(x.date)} · ${g.direction==='in'?'+':'−'}${money(Math.abs(x.amount))}</span>`).join('')}${g.items.length>12?`<span class="occ">+ ${g.items.length-12} autres</span>`:''}</div><div class="field-row"><div class="field"><label class="label">Cette opération est…</label><select class="select" data-group="${g.id}|category"><option value="">— à confirmer —</option>${cats.map(c=>`<option value="${c[0]}" ${g.category===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div><div class="field"><label class="label">Montant mensuel à retenir</label><div class="money"><input class="input" type="number" data-group="${g.id}|acceptedAmount" value="${num(g.acceptedAmount).toFixed(2)}"></div><span class="help">Pour un groupe mensuel, il s'agit de la somme moyenne de toutes ses opérations dans un mois, pas de la moyenne par transaction.</span></div></div><label><input type="checkbox" data-group="${g.id}|confirmed" ${g.confirmed?'checked':''}> Je valide ce groupe</label></div>`}
function unmatchedHtml(){const tx=state.tx.filter(t=>!state.groups.some(g=>g.items.includes(t)));return tx.slice(0,100).map(t=>`<div>${dateFr(t.date)} — ${esc(t.label)} — ${money(t.amount)}</div>`).join('')||'Aucune.'}
function annualHtml(){const monthly=Array(12).fill(0);state.annual.forEach(e=>monthly[num(e.month)]+=Math.max(0,num(e.amount)-num(e.aid)-num(e.covered)));const max=Math.max(1,...monthly);
 return `<div class="eyebrow">Dépenses annuelles</div><h2>Ajoutez ce qui gêne une ou deux fois dans l’année</h2><p class="lead">Ne renseignez pas une dépense déjà entièrement financée par une réserve existante. Si elle n’est couverte qu’en partie, indiquez ce qui existe déjà.</p><div class="calendar">${monthly.map((v,i)=>`<div class="month ${v?'hot':''}"><div class="bar" style="height:${Math.max(3,v/max*55)}px"></div><div class="m">${MONTHS[i].slice(0,3)}</div><div class="amt">${money(v)}</div></div>`).join('')}</div>
 ${state.annual.map((e,i)=>`<div class="group-card"><div class="field-row three"><div class="field"><label class="label">Dépense</label><input class="input" data-annual="${i}|name" value="${esc(e.name)}"></div><div class="field"><label class="label">Mois</label><select class="select" data-annual="${i}|month">${MONTHS.map((m,j)=>`<option value="${j}" ${num(e.month)===j?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label class="label">Jour approximatif</label><input class="input" type="number" min="1" max="28" data-annual="${i}|day" value="${num(e.day)||15}"></div></div><div class="field-row three"><div class="field"><label class="label">Montant total</label><div class="money"><input class="input" type="number" data-annual="${i}|amount" value="${num(e.amount)}"></div></div><div class="field"><label class="label">Aide disponible à temps</label><div class="money"><input class="input" type="number" data-annual="${i}|aid" value="${num(e.aid)}"></div></div><div class="field"><label class="label">Déjà financé par une réserve</label><div class="money"><input class="input" type="number" data-annual="${i}|covered" value="${num(e.covered)}"></div></div></div><button class="btn ghost small" data-remove-annual="${i}">Supprimer</button></div>`).join('')}
 <button class="btn secondary" id="addAnnual">+ Ajouter une dépense annuelle</button>`}
function needsHtml(){const vals=state.minWeekly;return `<div class="eyebrow">Vérification humaine</div><h2>Quel minimum hebdomadaire vous paraît réellement tenable ?</h2><p class="lead">Ces montants ne sont pas retirés une deuxième fois. Ils servent à vérifier que le budget calculé est réaliste pour votre foyer.</p><div class="field-row"><div class="field"><label class="label">Alimentation</label><div class="money"><input class="input" type="number" data-need="food" value="${num(vals.food)}"></div></div><div class="field"><label class="label">Carburant et transports</label><div class="money"><input class="input" type="number" data-need="fuel" value="${num(vals.fuel)}"></div></div><div class="field"><label class="label">Santé</label><div class="money"><input class="input" type="number" data-need="health" value="${num(vals.health)}"></div></div><div class="field"><label class="label">Enfants et quotidien</label><div class="money"><input class="input" type="number" data-need="children" value="${num(vals.children)}"></div></div><div class="field"><label class="label">Autre indispensable</label><div class="money"><input class="input" type="number" data-need="other" value="${num(vals.other)}"></div></div></div><div class="callout info"><strong>Minimum déclaré : ${money(Object.values(vals).reduce((a,b)=>a+num(b),0))} par semaine</strong></div>
 <details><summary>Travailler aussi sur un découvert permanent</summary><div class="details-body"><label><input id="balanceEnabled" type="checkbox" ${state.balance.enabled?'checked':''}> Oui, je veux calculer une remontée progressive du compte.</label>${state.balance.enabled?`<div class="field-row three"><div class="field"><label class="label">Point bas habituel</label><div class="money"><input class="input" type="number" data-balance="low" value="${num(state.balance.low)}"></div></div><div class="field"><label class="label">Objectif</label><div class="money"><input class="input" type="number" data-balance="target" value="${num(state.balance.target)}"></div></div><div class="field"><label class="label">Effort par semaine</label><div class="money"><input class="input" type="number" data-balance="effort" value="${num(state.balance.effort)}"></div></div></div>`:''}</div></details>`}
function resultsHtml(){const r=resultData(),t=tamponData(),minimum=Object.values(state.minWeekly).reduce((a,b)=>a+num(b),0),cover=minimum>0?r.weekly/minimum:null;const correction=state.balance.enabled?Math.max(0,num(state.balance.target)-num(state.balance.low)):0;const duration=correction&&num(state.balance.effort)>0?Math.ceil(correction/num(state.balance.effort)):0;
 return `<div class="eyebrow">Résultat</div><h2>Votre plan REBOOT</h2><div class="result-hero"><div class="muted" style="color:#dbe3ff">Budget hebdomadaire durable</div><div class="big">${money(r.weekly)} / semaine</div><div>Après revenus, charges mensuelles et dépenses annuelles.</div></div>
 <div class="result-grid"><div class="result-card"><div class="k">Revenus annuels retenus</div><div class="v">${money(r.income)}</div></div><div class="result-card"><div class="k">Charges mensuelles annualisées</div><div class="v">${money(r.monthlyCharges)}</div></div><div class="result-card"><div class="k">Dépenses annuelles nettes</div><div class="v">${money(r.annualNet+r.annualCharges)}</div></div><div class="result-card"><div class="k">Minimum déclaré</div><div class="v">${money(minimum)}/sem.</div></div><div class="result-card"><div class="k">Dépenses historiques non classées</div><div class="v">${money(r.histVariableMonthly)}/mois</div></div><div class="result-card"><div class="k">Fiabilité</div><div class="v">${state.mode==='csv'?'Contrôlée':'Déclarative'}</div></div></div>
 <div class="callout ${cover===null?'info':cover<1?'danger':cover<1.15?'warn':'good'}"><strong>${cover===null?'Minimum à confirmer':cover<1?'Budget inférieur au minimum déclaré':cover<1.15?'Budget très serré':'Budget cohérent avec votre minimum'}</strong>${cover!==null?`<br>Le budget couvre ${Math.round(cover*100)} % du minimum que vous avez indiqué.`:''}</div>
 <h3 style="margin-top:28px">Tampon de démarrage par échéance</h3><div class="table-wrap"><table class="table"><thead><tr><th>Dépense</th><th>Échéance</th><th>À financer</th><th>Constitué naturellement</th><th>Complément</th><th>Effort juste à temps</th></tr></thead><tbody>${t.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${dateFr(x.due)}</td><td>${money(x.net)}</td><td>${money(x.natural)}</td><td><strong>${money(x.gap)}</strong></td><td>${money(x.weeklyJit)}/sem.</td></tr>`).join('')||'<tr><td colspan="6">Aucune dépense annuelle à préfinancer.</td></tr>'}</tbody></table></div>
 <div class="result-grid" style="margin-top:12px"><div class="result-card"><div class="k">Tout sécuriser aujourd’hui</div><div class="v">${money(t.total)}</div><div class="muted">Somme de tous les compléments.</div></div><div class="result-card"><div class="k">Plus grosse échéance</div><div class="v">${money(t.max)}</div><div class="muted">Complément maximal pour une seule dépense.</div></div><div class="result-card"><div class="k">Effort hebdomadaire cumulé maintenant</div><div class="v">${money(t.peakWeekly)}/sem.</div><div class="muted">Si vous constituez tous les compléments juste à temps dès aujourd’hui.</div></div></div>
 ${state.balance.enabled?`<h3 style="margin-top:28px">Objectif de solde séparé</h3><div class="callout info"><strong>${money(correction)} à remonter</strong><br>Avec ${money(state.balance.effort)} par semaine : environ ${duration} semaines. Cet effort commence de préférence après la sécurisation des premières échéances.</div>`:''}
 <div class="callout good"><strong>Vos données restent locales.</strong><br>Exportez votre dossier REBOOT pour le conserver ou le réimporter plus tard.</div>`}
function renderSide(s){const texts=[
 ['Pourquoi ce calcul ?','Le but est de transformer une année irrégulière en un montant simple à utiliser chaque semaine.'],
 ['Import ou saisie','L’import sert surtout à éviter les oublis et à détecter les montants qui ont changé.'],
 ['Colonnes','Vous gardez le contrôle : le calculateur ne devine pas définitivement la structure de votre fichier.'],
 ['Validation','Une proposition n’est jamais imposée. Vous confirmez le type et le montant à retenir.'],
 ['Compléments','Ajoutez uniquement ce qui manque réellement dans la détection.'],
 ['Dépenses annuelles','Une réserve mensuelle déjà comptée ne doit pas être comptée une seconde fois.'],
 ['Minimum réaliste','Un calcul mathématique peut être juste mais impossible à vivre. Votre minimum déclaré permet de le détecter.'],
 ['Lisez surtout trois chiffres','Le budget semaine, les compléments par échéance et l’éventuel effort séparé sur le solde.']
 ];return `<h3>${texts[s][0]}</h3><p>${texts[s][1]}</p><div class="callout info"><strong>Astuce</strong><br>${s===3?'Commencez par les salaires et prélèvements mensuels les plus évidents.':s===5?'Pour Noël déjà financé par 115 € versés chaque mois, gardez les 115 € comme charge mensuelle et ne recomptez pas les achats couverts.':'Vous pourrez revenir en arrière sans perdre vos réponses.'}</div>`}
function bind(){
 $('#groupSearch')?.addEventListener('input',e=>{state.groupSearch=e.target.value;save();render()});
 $('#groupFilter')?.addEventListener('change',e=>{state.groupFilter=e.target.value;save();render()});
 $$('[data-key]').forEach(el=>el.onchange=e=>{state[e.target.dataset.key]=e.target.value;save();render()});
 $('#csvFile')?.addEventListener('change',async e=>{const decoded=await readBankFile(e.target.files[0]);const d=detectDelimiter(decoded.text);state.mapping.delimiter=d;state.rawRows=parseCSV(decoded.text,d);state.mapping.headerRow=autoHeader(state.rawRows);state.headers=state.rawRows[state.mapping.headerRow]||[];state.fileEncoding=decoded.encoding;autoMap();save();render()});
 $$('[data-map]').forEach(el=>el.onchange=e=>{let k=e.target.dataset.map,v=e.target.value;if(k==='headerRow'){v=Math.max(0,num(v)-1);state.mapping[k]=v;state.headers=state.rawRows[v]||[]}else state.mapping[k]=v;save();render()});
 $$('[data-group]').forEach(el=>{el.onchange=e=>{const [id,k]=e.target.dataset.group.split('|'),g=state.groups.find(x=>x.id===id);g[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;save();render()};el.oninput=el.onchange});
 $$('[data-manual]').forEach(el=>{el.oninput=e=>{const [i,k]=e.target.dataset.manual.split('|');state.manualMonthly[i][k]=e.target.value;save()};el.onchange=el.oninput});
 $('#addManual')?.addEventListener('click',()=>{state.manualMonthly.push({name:'',type:'charge',amount:0});save();render()});$$('[data-remove-manual]').forEach(el=>el.onclick=()=>{state.manualMonthly.splice(num(el.dataset.removeManual),1);save();render()});
 $$('[data-annual]').forEach(el=>{el.oninput=e=>{const [i,k]=e.target.dataset.annual.split('|');state.annual[i][k]=e.target.value;save();render()};el.onchange=el.oninput});$('#addAnnual')?.addEventListener('click',()=>{state.annual.push({name:'',month:new Date().getMonth(),day:15,amount:0,aid:0,covered:0});save();render()});$$('[data-remove-annual]').forEach(el=>el.onclick=()=>{state.annual.splice(num(el.dataset.removeAnnual),1);save();render()});
 $$('[data-need]').forEach(el=>el.oninput=e=>{state.minWeekly[e.target.dataset.need]=e.target.value;save();render()});
 $('#balanceEnabled')?.addEventListener('change',e=>{state.balance.enabled=e.target.checked;save();render()});$$('[data-balance]').forEach(el=>el.oninput=e=>{state.balance[e.target.dataset.balance]=e.target.value;save();render()});
}
function autoMap(){const hs=state.headers.map(x=>String(x).toLowerCase());const find=(rx)=>{const i=hs.findIndex(x=>rx.test(x));return i>=0?String(i):''};state.mapping.date=find(/date/);state.mapping.label=find(/libell|description|intitul/);state.mapping.debit=find(/débit|debit/);state.mapping.credit=find(/crédit|credit/);state.mapping.amount=find(/montant|amount/);state.mapping.amountMode=state.mapping.debit||state.mapping.credit?'split':'signed'}
function buildTransactions(){if(state.mode!=='csv')return true;const m=state.mapping;if(m.date===''||m.label===''||(m.amountMode==='signed'&&m.amount==='')||(m.amountMode==='split'&&(m.debit===''||m.credit==='')))return false;const rows=state.rawRows.slice(num(m.headerRow)+1),tx=[];for(const r of rows){const d=parseDate(r[num(m.date)],m.dateFormat);if(!d)continue;let a=0;if(m.amountMode==='signed')a=num(r[num(m.amount)]);else a=num(r[num(m.credit)])-Math.abs(num(r[num(m.debit)]));if(!a)continue;tx.push({date:d,label:r[num(m.label)]||'',amount:a})}state.tx=tx;clusterTransactions();return true}
$('#back').onclick=()=>{state.step=Math.max(0,state.step-1);save();render()};$('#next').onclick=()=>{if(state.step===1&&state.mode==='csv'&&!state.rawRows.length){alert('Choisissez un fichier CSV ou revenez sélectionner la saisie manuelle.');return}if(state.step===2&&state.mode==='csv'&&!buildTransactions()){alert('Indiquez les colonnes nécessaires.');return}if(state.step===7){window.print();return}state.step=Math.min(7,state.step+1);save();render()};
$('#export').onclick=()=>{const b=new Blob([JSON.stringify(state,(k,v)=>v instanceof Date?v.toISOString():v,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='REBOOT_dossier.json';a.click();URL.revokeObjectURL(a.href)};
$('#importJson').onclick=()=>$('#jsonFile').click();$('#jsonFile').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());Object.assign(state,x);state.tx=(state.tx||[]).map(t=>({...t,date:new Date(t.date)}));(state.groups||[]).forEach(g=>g.items=(g.items||[]).map(t=>({...t,date:new Date(t.date)})));save();render()}catch{alert('Fichier REBOOT invalide.')}};
$('#reset').onclick=async()=>{if(confirm('Effacer toutes les données locales ?')){await RebootSecureStorage.clear(DATABASE,STORE);location.reload()}};
async function init(){await load();state.tx=(state.tx||[]).map(t=>({...t,date:new Date(t.date)}));(state.groups||[]).forEach(g=>g.items=(g.items||[]).map(t=>({...t,date:new Date(t.date)})));render()}
init();
</script>
</body></html>
