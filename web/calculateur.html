function resultsHtml(){const r=resultData(),t=tamponData(),minimum=Object.values(state.minWeekly).reduce((a,b)=>a+num(b),0),cover=minimum>0?r.weekly/minimum:null;const correction=state.balance.enabled?Math.max(0,num(state.balance.target)-num(state.balance.low)):0;const duration=correction&&num(state.balance.effort)>0?Math.ceil(correction/num(state.balance.effort)):0;const ended=state.manualMonthly.filter(m=>!manualIsActive(m));
 return `<div class="eyebrow">Résultat</div><h2>Votre plan REBOOT</h2><div class="result-hero"><div class="muted" style="color:#dbe3ff">Budget hebdomadaire durable</div><div class="big">${money(r.weekly)} / semaine</div><div>Après revenus, charges mensuelles et dépenses annuelles.</div></div>

 <div class="callout ${cover===null?'info':cover<1?'danger':cover<1.15?'warn':'good'}"><strong>${cover===null?'Minimum à confirmer':cover<1?'Budget inférieur au minimum déclaré':cover<1.15?'Budget très serré':'Budget cohérent avec votre minimum'}</strong>${cover!==null?`<br>Le budget couvre ${Math.round(cover*100)} % du minimum que vous avez indiqué.`:''}</div>${ended.length?`<div class="callout warn"><strong>${ended.length} charge${ended.length>1?'s':''} arrivée${ended.length>1?'s':''} à échéance.</strong><br>${ended.map(m=>esc(m.name||'Sans nom')).join(', ')} n’influence plus le budget. Vérifiez que le crédit ou contrat est réellement clos, puis retirez-le du référentiel.<div class="toolbar" style="margin-top:12px">${state.manualMonthly.map((m,index)=>!manualIsActive(m)?`<button class="btn secondary small" type="button" data-remove-expired="${index}">Retirer « ${esc(m.name||'cette charge')} »</button>`:'').join('')}</div></div>`:''}
 <h3 style="margin-top:28px">Tampon de démarrage par échéance</h3><div class="table-wrap"><table class="table"><thead><tr><th>Dépense</th><th>Échéance</th><th>À financer</th><th>Constitué naturellement</th><th>Complément</th><th>Effort juste à temps</th></tr></thead><tbody>${t.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${dateFr(x.due)}</td><td>${money(x.net)}</td><td>${money(x.natural)}</td><td><strong>${money(x.gap)}</strong></td><td>${money(x.weeklyJit)}/sem.</td></tr>`).join('')||'<tr><td colspan="6">Aucune dépense annuelle à préfinancer.</td></tr>'}</tbody></table></div>
 <div class="result-grid" style="margin-top:12px"><div class="result-card"><div class="k">Tout sécuriser aujourd’hui</div><div class="v">${money(t.total)}</div><div class="muted">Somme de tous les compléments.</div></div><div class="result-card"><div class="k">Plus grosse échéance</div><div class="v">${money(t.max)}</div><div class="muted">Complément maximal pour une seule dépense.</div></div><div class="result-card"><div class="k">Effort hebdomadaire cumulé maintenant</div><div class="v">${money(t.peakWeekly)}/sem.</div><div class="muted">Si vous constituez tous les compléments juste à temps dès aujourd’hui.</div></div></div>
 ${state.balance.enabled?`<h3 style="margin-top:28px">Objectif de solde séparé</h3><div class="callout info"><strong>${money(correction)} à remonter</strong><br>Avec ${money(state.balance.effort)} par semaine : environ ${duration} semaines. Cet effort commence de préférence après la sécurisation des premières échéances.</div>`:''}
 <div class="callout good"><strong>Votre budget est prêt à être suivi.</strong><br>Choisissez le jour où votre semaine recommence : REBOOT ouvrira ensuite le suivi quotidien avec ce montant.</div><div class="field" style="max-width:360px"><label class="label" for="trackerRebootDay">Jour REBOOT</label><select class="select" id="trackerRebootDay"><option value="">Choisir un jour</option>${['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'].map((day,index)=>`<option value="${index}" ${String(state.trackingRebootDay)===String(index)?'selected':''}>${day}</option>`).join('')}</select><span class="help">Le premier jour de votre cycle hebdomadaire.</span></div><div class="toolbar"><button class="btn primary" id="useForTracking" type="button">Ouvrir mon suivi quotidien</button><a class="btn secondary" href="app.html">Revenir au suivi</a><a class="btn secondary" href="sauvegarde.html">Sauvegarde chiffrée</a></div>`}
function renderSide(s){const texts=[
 ['Pourquoi ce calcul ?','Le but est de transformer une année irrégulière en un montant simple à utiliser chaque semaine.'],
 ['Import ou saisie','L’import sert surtout à éviter les oublis et à détecter les montants qui ont changé.'],
 ['Colonnes','Vous gardez le contrôle : le calculateur ne devine pas définitivement la structure de votre fichier.'],
 ['Validation','Une proposition n’est jamais imposée. Vous confirmez le type et le montant à retenir.'],

function bind(){
 $('#groupSearch')?.addEventListener('input',e=>{state.groupSearch=e.target.value;save();render()});
 $('#groupFilter')?.addEventListener('change',e=>{state.groupFilter=e.target.value;save();render()});
 $$('[data-key]').forEach(el=>el.onchange=e=>{state[e.target.dataset.key]=e.target.value;save(true);render()});
 $('#csvFile')?.addEventListener('change',async e=>{const decoded=await readBankFile(e.target.files[0]);const d=detectDelimiter(decoded.text);state.mapping.delimiter=d;state.rawRows=parseCSV(decoded.text,d);state.mapping.headerRow=autoHeader(state.rawRows);state.headers=state.rawRows[state.mapping.headerRow]||[];state.fileEncoding=decoded.encoding;autoMap();save(true);render()});
 $$('[data-map]').forEach(el=>el.onchange=e=>{let k=e.target.dataset.map,v=e.target.value;if(k==='headerRow'){v=Math.max(0,num(v)-1);state.mapping[k]=v;state.headers=state.rawRows[v]||[]}else state.mapping[k]=v;save(true);render()});
 $$('[data-group]').forEach(el=>{el.onchange=e=>{const [id,k]=e.target.dataset.group.split('|'),g=state.groups.find(x=>x.id===id);if(!g)return;g[k]=e.target.value;if(k==='category')g.confirmed=Boolean(e.target.value);if(k==='incomeOption'){g.acceptedAmount=e.target.value==='average'?g.monthlyAverage:g.regularMonthly;g.amountChanged=false}save(true);render()};el.oninput=e=>{if(e.target.dataset.group.endsWith('|acceptedAmount')){const [id,k]=e.target.dataset.group.split('|'),g=state.groups.find(x=>x.id===id);if(!g)return;g[k]=e.target.value;save(true)}}});
 $$('[data-apply-observed]').forEach(el=>el.onclick=()=>{const g=state.groups.find(x=>x.id===el.dataset.applyObserved);if(!g)return;g.acceptedAmount=g.observedAmount;g.amountChanged=false;save(true);render()});
 $$('[data-open-group]').forEach(el=>el.onclick=()=>{const group=state.groups.find(item=>item.id===el.dataset.openGroup);if(group)openGroupDetails(group)});$('#applySelectedTransactions')?.addEventListener('click',applySelectedTransactions);
 $$('[data-manual]').forEach(el=>{el.oninput=e=>{const [i,k]=e.target.dataset.manual.split('|');state.manualMonthly[i][k]=e.target.value;save(true)};el.onchange=el.oninput});
 $('#addManual')?.addEventListener('click',()=>{state.manualMonthly.push({name:'',type:'charge',amount:0});save(true);render()});$$('[data-remove-manual]').forEach(el=>el.onclick=()=>{state.manualMonthly.splice(num(el.dataset.removeManual),1);save(true);render()});$$('[data-remove-expired]').forEach(el=>el.onclick=()=>{const index=num(el.dataset.removeExpired),entry=state.manualMonthly[index];if(!entry||!confirm(`Retirer « ${entry.name||'cette charge'} » du budget ? Cette action est définitive dans le calculateur.`))return;state.manualMonthly.splice(index,1);save(true);render()});
 $$('[data-add-template]').forEach(el=>el.onclick=()=>{const [type,name]=el.dataset.addTemplate.split('|');state.manualMonthly.push({name,type,amount:0,endsOn:''});save(true);render()});
 $$('[data-annual]').forEach(el=>{el.oninput=e=>{const [i,k]=e.target.dataset.annual.split('|');state.annual[i][k]=e.target.value;save(true);render()};el.onchange=el.oninput});$('#addAnnual')?.addEventListener('click',()=>{state.annual.push({name:'',month:new Date().getMonth(),day:15,amount:0,aid:0,covered:0});save(true);render()});$$('[data-remove-annual]').forEach(el=>el.onclick=()=>{state.annual.splice(num(el.dataset.removeAnnual),1);save(true);render()});
 $$('[data-add-annual-template]').forEach(el=>el.onclick=()=>{state.annual.push({name:el.dataset.addAnnualTemplate,month:new Date().getMonth(),day:15,amount:0,aid:0,covered:0});save(true);render()});
 $$('[data-need]').forEach(el=>el.oninput=e=>{state.minWeekly[e.target.dataset.need]=e.target.value;save(true);render()});
 $('#balanceEnabled')?.addEventListener('change',e=>{state.balance.enabled=e.target.checked;save(true);render()});$$('[data-balance]').forEach(el=>el.oninput=e=>{state.balance[e.target.dataset.balance]=e.target.value;save(true);render()});
 $('#useForTracking')?.addEventListener('click',sendBudgetToTracker);
 $('#trackerRebootDay')?.addEventListener('change',e=>{state.trackingRebootDay=e.target.value;save(true)});
}
function trackerReserveLines(){return [...state.groups.filter(g=>g.category==='reserve_monthly').map(g=>({name:String(g.latestLabel||g.label||'').trim(),monthlyContributionMinor:Math.round(num(g.acceptedAmount)*100)})),...state.manualMonthly.filter(m=>m.type==='reserve'&&manualIsActive(m)).map(m=>({name:String(m.name||'').trim(),monthlyContributionMinor:Math.round(num(m.amount)*100)}))].filter(r=>r.name&&r.monthlyContributionMinor>0)}
function sameReserve(reserve,line){return normalizeLabel(reserve.name)===normalizeLabel(line.name)&&Math.abs(num(reserve.monthlyContributionMinor)-line.monthlyContributionMinor)<=1}
async function sendBudgetToTracker(){await save(true);const result=resultData(),weeklyBudgetMinor=Math.floor(result.weekly*100),rebootDay=$('#trackerRebootDay')?.value;if(!Number.isSafeInteger(weeklyBudgetMinor)||weeklyBudgetMinor<=0){alert('Le budget hebdomadaire doit être positif avant de l’envoyer au suivi.');return}if(rebootDay===''){alert('Choisissez le jour où votre semaine REBOOT recommence.');return}const reserves=trackerReserveLines();const daily=await RebootSecureStorage.read('reboot-local-v1','reboot-local-v1')||{};const createDriveBackup=daily.onboarding?.storage==='drive';daily.baseWeeklyBudgetMinor=weeklyBudgetMinor;daily.weeklyBudgetMinor=weeklyBudgetMinor;daily.rebootDay=Number(rebootDay);daily.configured=true;daily.budgetSource='calculator';daily.onboarding=daily.onboarding?{...daily.onboarding,completedAt:new Date().toISOString()}:null;daily.calculatorBudget={version:1,updatedAt:new Date().toISOString(),sourceUpdatedAt:state.updatedAt,weeklyBudgetMinor,incomeAnnualMinor:Math.round(result.income*100),monthlyChargesAnnualMinor:Math.round(result.monthlyCharges*100),annualChargesMinor:Math.round((result.annualCharges+result.annualNet)*100),permanentReserveLines:reserves};daily.reserves=(daily.reserves||[]).map(reserve=>({...reserve,includedInCalculatorBudget:!reserve.closedAt&&reserves.some(line=>sameReserve(reserve,line))}));reserves.forEach(line=>{if(!(daily.reserves||[]).some(reserve=>sameReserve(reserve,line))){daily.reserves.push({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,name:line.name,kind:'recurring',initialBalanceMinor:0,annualTargetMinor:line.monthlyContributionMinor*12,targetMinor:0,monthlyContributionMinor:line.monthlyContributionMinor,openedOn:new Date().toISOString().slice(0,10),real:false,includedInCalculatorBudget:true,createdAt:new Date().toISOString()})}});await RebootSecureStorage.save('reboot-local-v1',daily);window.location.href=createDriveBackup?'drive.html?action=create':'app.html'}
function autoMap(){const hs=state.headers.map(x=>String(x).toLowerCase());const find=(rx)=>{const i=hs.findIndex(x=>rx.test(x));return i>=0?String(i):''};state.mapping.date=find(/date/);state.mapping.label=find(/libell|description|intitul/);state.mapping.debit=find(/débit|debit/);state.mapping.credit=find(/crédit|credit/);state.mapping.amount=find(/montant|amount/);state.mapping.amountMode=state.mapping.debit||state.mapping.credit?'split':'signed'}
function buildTransactions(){if(state.mode!=='csv')return true;const m=state.mapping;if(m.date===''||m.label===''||(m.amountMode==='signed'&&m.amount==='')||(m.amountMode==='split'&&(m.debit===''||m.credit==='')))return false;const rows=state.rawRows.slice(num(m.headerRow)+1),tx=[];for(const r of rows){const d=parseDate(r[num(m.date)],m.dateFormat);if(!d)continue;let a=0;if(m.amountMode==='signed')a=num(r[num(m.amount)]);else a=num(r[num(m.credit)])-Math.abs(num(r[num(m.debit)]));if(!a)continue;tx.push({date:d,label:r[num(m.label)]||'',amount:a})}state.tx=tx;clusterTransactions();return true}
$('#back').onclick=()=>{state.step=Math.max(0,state.step-1);save();render()};$('#next').onclick=()=>{if(state.step===1&&state.mode==='csv'&&!state.rawRows.length){alert('Choisissez un fichier CSV ou revenez sélectionner la saisie manuelle.');return}if(state.step===2&&state.mode==='csv'&&!buildTransactions()){alert('Indiquez les colonnes nécessaires.');return}if(state.step===7){window.print();return}state.step=Math.min(7,state.step+1);save();render()};
$('#reset').onclick=async()=>{if(confirm('Effacer toutes les données locales ?')){await RebootSecureStorage.clear(DATABASE,STORE);location.reload()}};
async function init(){await load();state.tx=(state.tx||[]).map(t=>({...t,date:new Date(t.date)}));(state.groups||[]).forEach(g=>g.items=(g.items||[]).map(t=>({...t,date:new Date(t.date)})));render()}
init();
</script>
