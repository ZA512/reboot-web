<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e6f67"><title>REBOOT — Créer une sauvegarde</title><link rel="stylesheet" href="app-shell.css"><link rel="stylesheet" href="data-page.css"></head><body>
<header class="reboot-nav"><a class="reboot-nav-brand" href="app.html"><span class="reboot-nav-mark">R</span><span><strong>REBOOT</strong></span></a></header><main class="shell"><a class="back" href="sauvegarde.html">← Vos données</a><p class="kicker">Créer une sauvegarde</p><h1>Une copie à conserver</h1><p class="lead">Choisissez simplement si le fichier doit être lisible directement ou protégé par un code.</p><section class="card" style="margin-top:28px"><h2>Niveau de protection</h2><div class="mode-list"><label class="mode"><input type="radio" name="mode" value="simple" checked><span><strong>Simple</strong><small>Fichier lisible, sans code à retenir.</small></span></label><label class="mode"><input type="radio" name="mode" value="protected"><span><strong>Protégée</strong><small>Fichier chiffré ; le code sera indispensable.</small></span></label></div><div id="protectedFields" class="hidden"><div class="field"><label for="backupCode">Code de récupération</label><input id="backupCode" class="input" minlength="16" autocomplete="new-password"><small>Au moins 16 caractères.</small></div><button class="button secondary" id="generateCode" type="button">Générer un code</button><div class="field"><label for="backupCodeConfirm">Confirmer le code</label><input id="backupCodeConfirm" class="input" minlength="16" autocomplete="new-password"></div><label class="check"><input id="backupAcknowledgement" type="checkbox"><span>J’ai conservé ce code dans un endroit sûr.</span></label></div><button class="button" id="createBackup" type="button">Télécharger la sauvegarde simple</button><p id="backupStatus" class="notice hidden"></p></section></main>
<script src="secure-storage.js"></script><script src="archive.js"></script><script>(()=>{const $=s=>document.querySelector(s),mode=()=>document.querySelector('input[name="mode"]:checked').value;function update(){const protectedMode=mode()==='protected';$('#protectedFields').classList.toggle('hidden',!protectedMode);$('#createBackup').textContent=protectedMode?'Télécharger la sauvegarde protégée':'Télécharger la sauvegarde simple'}document.querySelectorAll('input[name="mode"]').forEach(input=>input.onchange=update);$('#generateCode').onclick=()=>{const code=RebootArchive.recoveryCode();$('#backupCode').value=code;$('#backupCodeConfirm').value=code};$('#createBackup').onclick=async()=>{const protectedMode=mode()==='protected',code=$('#backupCode').value.trim();if(protectedMode&&(code.length<16||code!==$('#backupCodeConfirm').value.trim()||!$('#backupAcknowledgement').checked)){status('Vérifiez le code, sa confirmation et la case de conservation.',true);return}const button=$('#createBackup');button.disabled=true;try{const content=await RebootArchive.create(code,{encrypted:protectedMode}),link=document.createElement('a');link.href=URL.createObjectURL(new Blob([content],{type:'application/json'}));link.download=`REBOOT-sauvegarde-${protectedMode?'protegee':'simple'}-${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);await RebootArchive.noteBackup('local');status('Sauvegarde téléchargée.')}catch(error){status(error.message||'Création impossible.',true)}finally{button.disabled=false}};function status(text,warning=false){$('#backupStatus').textContent=text;$('#backupStatus').classList.toggle('warning',warning);$('#backupStatus').classList.remove('hidden')}update()})();</script></body></html>
